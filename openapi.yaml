openapi: 3.0.3
info:
  title: Pixxel API
  version: 1.0.0
  description: 'Enterprise Architecture Repository Platform — internal REST API.


    Hand-maintained per the project convention in CLAUDE.md: every new or changed route must have its
    entry added/updated here as part of the same change. Auth is a single HttpOnly `authToken` cookie
    set by /api/auth/login or /api/auth/register — there is no separate API key/bearer scheme.'
servers:
- url: /
  description: Same-origin (this app serves its own API)
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: authToken
      description: HttpOnly session cookie. Most routes also enforce a role via requireUser(req, role)
        — see each operation's description.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatarInitials:
          type: string
        role:
          type: string
          enum:
          - Admin
          - Member
          - Viewer
        createdAt:
          type: string
          format: date-time
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        tableName:
          type: string
        recordId:
          type: string
        action:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
        performedById:
          type: string
        performedByName:
          type: string
        performedAt:
          type: string
          format: date-time
        oldValues:
          type: object
          nullable: true
        newValues:
          type: object
          nullable: true
    Asset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortCode:
          type: string
        description:
          type: string
        type:
          type: string
        category:
          type: string
        icon:
          type: string
        lifecycleStatus:
          type: string
        departmentIds:
          type: array
          items:
            type: string
        tierId:
          type: string
        strategyId:
          type: string
        domainId:
          type: string
        vendorId:
          type: string
        businessOwner:
          type: string
        technicalOwner:
          type: string
        slaAvailability:
          type: string
        slaRto:
          type: string
        slaRpo:
          type: string
        goLiveDate:
          type: string
          format: date
        retirementDate:
          type: string
          format: date
        appUrl:
          type: string
        docUrl:
          type: string
        notes:
          type: string
    AssetInput:
      type: object
      properties:
        name:
          type: string
        shortCode:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - SaaS
          - On-Premise
          - Hybrid
          - Cloud
          - Open Source
          - Other
        category:
          type: string
        icon:
          type: string
        lifecycleStatus:
          type: string
          enum:
          - Proposed
          - Approved
          - In Development
          - Production
          - Sunset
          - Retired
        departmentIds:
          type: array
          items:
            type: string
        architectIds:
          type: array
          items:
            type: string
        capabilityIds:
          type: array
          items:
            type: string
        tierId:
          type: string
        strategyId:
          type: string
        complexityId:
          type: string
        domainId:
          type: string
        vendorId:
          type: string
        businessOwner:
          type: string
        technicalOwner:
          type: string
        slaAvailability:
          type: string
        slaRto:
          type: string
        slaRpo:
          type: string
        goLiveDate:
          type: string
          format: date
        retirementDate:
          type: string
          format: date
        appUrl:
          type: string
        docUrl:
          type: string
        notes:
          type: string
        heroDiagramId:
          type: string
    Contract:
      type: object
      properties:
        id:
          type: string
        vendorId:
          type: string
        vendorName:
          type: string
        assetId:
          type: string
        assetName:
          type: string
        title:
          type: string
        value:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        noticePeriodDays:
          type: number
        autoRenews:
          type: boolean
        owner:
          type: string
        status:
          type: string
          enum:
          - Active
          - Terminated
        docUrl:
          type: string
        notes:
          type: string
    ContractInput:
      type: object
      properties:
        vendorId:
          type: string
        assetId:
          type: string
        title:
          type: string
        value:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        noticePeriodDays:
          type: number
        autoRenews:
          type: boolean
        owner:
          type: string
        status:
          type: string
          enum:
          - Active
          - Terminated
        docUrl:
          type: string
        notes:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
paths:
  /api/asset-complexity:
    get:
      summary: List asset complexities
      tags:
      - Asset Complexity
      description: 'Requires: any authenticated user'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name: &id001
                      type: string
                    description: &id002
                      type: string
                    sortOrder: &id003
                      type: number
        '401':
          description: Not authenticated
      security: &id004
      - cookieAuth: []
    post:
      summary: Create an asset complexity
      tags:
      - Asset Complexity
      description: 'Requires: Admin or Member'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id001
                description: *id002
                sortOrder: *id003
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/asset-complexity/{id}:
    put:
      summary: Update an asset complexity
      tags:
      - Asset Complexity
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id001
                description: *id002
                sortOrder: *id003
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
    delete:
      summary: Delete an asset complexity
      tags:
      - Asset Complexity
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/asset-risks:
    get:
      summary: List ad-hoc asset risks (register, not the risk-factor framework)
      tags:
      - Security
      description: 'Requires: any authenticated user'
      parameters:
      - name: asset
        in: query
        required: false
        schema:
          type: string
        description: filter by asset id
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
    post:
      summary: Create an asset risk entry
      tags:
      - Security
      description: 'Requires: Admin or Member'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  type: string
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                likelihood:
                  type: string
                impact:
                  type: string
                status:
                  type: string
                owner:
                  type: string
      responses:
        '201':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/asset-risks/{id}:
    put:
      summary: Update an asset risk entry
      tags:
      - Security
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  type: string
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                likelihood:
                  type: string
                impact:
                  type: string
                status:
                  type: string
                owner:
                  type: string
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
    delete:
      summary: Delete an asset risk entry
      tags:
      - Security
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/asset-strategy:
    get:
      summary: List asset strategies
      tags:
      - Asset Strategy
      description: 'Requires: any authenticated user'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name: &id005
                      type: string
                    description: &id006
                      type: string
                    sortOrder: &id007
                      type: number
        '401':
          description: Not authenticated
      security: *id004
    post:
      summary: Create an asset strategy
      tags:
      - Asset Strategy
      description: 'Requires: Admin or Member'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id005
                description: *id006
                sortOrder: *id007
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/asset-strategy/{id}:
    put:
      summary: Update an asset strategy
      tags:
      - Asset Strategy
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: *id005
                description: *id006
                sortOrder: *id007
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
    delete:
      summary: Delete an asset strategy
      tags:
      - Asset Strategy
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/assets:
    get:
      summary: List assets (joins department/vendor/domain/strategy/tier names)
      tags:
      - Assets
      description: 'Requires: any authenticated user'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: search name/short_code/description/business_owner/technical_owner/notes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '401':
          description: Not authenticated
      security: *id004
    post:
      summary: Create an asset
      tags:
      - Assets
      description: 'Requires: Admin or Member'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/assets/my-assets:
    get:
      summary: Assets where the given user is business or technical owner
      tags:
      - Assets
      description: 'Requires: any authenticated user'
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}:
    get:
      summary: Get a single asset
      tags:
      - Assets
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          description: Not authenticated
      security: *id004
    put:
      summary: Update an asset
      tags:
      - Assets
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
    delete:
      summary: Delete an asset
      tags:
      - Assets
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/assets/{id}/dependencies:
    get:
      summary: Upstream/downstream dependency links for one asset
      tags:
      - Dependencies
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}/diagrams:
    get:
      summary: Diagrams linked to one asset
      tags:
      - Diagrams
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}/history:
    get:
      summary: Audit history for one asset
      tags:
      - Assets
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}/plantuml-diagrams:
    get:
      summary: PlantUML diagrams linked to one asset
      tags:
      - PlantUML
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}/projects:
    get:
      summary: Projects this asset is linked to
      tags:
      - Projects
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}/risk-assessments:
    get:
      summary: Risk factor assessments for one asset
      tags:
      - Security
      description: 'Requires: any authenticated user'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
  /api/assets/{id}/risk-assessments/{riskFactorId}:
    put:
      summary: Set the status/notes of one risk factor assessment for one asset
      tags:
      - Security
      description: 'Requires: Admin or Member'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      - name: riskFactorId
        in: path
        required: true
        schema:
          type: string
        description: Resource id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/audit:
    get:
      summary: Paginated, filterable audit log
      tags:
      - Audit
      description: 'Requires: Admin'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
        description: 1-based page number
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
        description: max 100
      - name: table
        in: query
        required: false
        schema:
          type: string
        description: filter by table_name
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: CREATE|UPDATE|DELETE
      - name: performer
        in: query
        required: false
        schema:
          type: string
        description: filter by performed_by_name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  total:
                    type: number
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/auth/login:
    post:
      summary: Log in with email/password. Returns mfaRequired instead of a session if MFA is enabled.
      tags:
      - Auth
      description: 'Requires: none'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/User'
                - type: object
                  properties:
                    mfaRequired:
                      type: boolean
                    mfaToken:
                      type: string
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/auth/logout:
    post:
      summary: Clear the session cookie
      tags:
      - Auth
      description: 'Requires: none'
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/auth/me:
    get:
      summary: Verify the current session and return the fresh user record
      tags:
      - Auth
      description: 'Requires: any authenticated user'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
      security: *id004
  /api/auth/mfa/challenge:
    post:
      summary: Complete login for an MFA-enabled account using a TOTP code or a recovery code
      tags:
      - Auth (MFA)
      description: 'Requires: none (short-lived mfaToken from /login instead)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaToken:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code, or omit and use recoveryCode instead
                recoveryCode:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role
      security: *id004
  /api/auth/mfa/disable:
    post:
      summary: Disable MFA (requires password re-confirmation)
      tags:
      - Auth (MFA)
      description: 'Requires: any authenticated user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: OK
        '401':
          description: Not authenticated
      security: *id004
  /api/auth/mfa/setup:
    post:
      summary: 'Begin MFA setup: generates a pending TOTP secret + QR code'
      tags:
      - Auth (MFA)
      description: 'Requires: any authenticated user'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  otpauthUri:
                    type: string
                  qrCodeDataUrl:
                    type: string
        '401':
          description: Not authenticated
      security: *id004
  /api/auth/mfa/status:
    get:
      summary: Check whether MFA is enabled for the current user
      tags:
      - Auth (MFA)
      description: 'Requires: any authenticated user'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '401':
          description: Not authenticated
      security: *id004
  /api/auth/mfa/verify-setup:
    post:
      summary: Confirm MFA setup with a 6-digit code; enables MFA and returns one-time recovery codes
      tags:
      - Auth (MFA)
      description: 'Requires: any authenticated user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
      security: *id004
  /api/auth/register:
    post:
      summary: Register a new account
      tags:
      - Auth
      description: 'Requires: none'
      requestBody:
        required: true
        content:
